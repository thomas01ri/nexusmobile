name: Build NEXUS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEXUS-Mobile-v1.0.2-debug.apk
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Mobile-v1.0.2-APK
          path: NEXUS-Mobile-v1.0.2-debug.apk
          if-no-files-found: error
          retention-days: 14
